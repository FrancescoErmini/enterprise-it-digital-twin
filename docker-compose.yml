name: enterprise-it-digital-twin

x-neo4j-client-env: &neo4j-client-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  NEO4J_READER_USER: ${NEO4J_READER_USER:-twin_reader}
  NEO4J_READER_PASSWORD_FILE: /secrets/neo4j_reader_password
  INGESTION_MANIFEST_PATH: /data/manifest/ingestion.json
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # One-shot: generates Neo4j credentials into the `secrets` volume on first start.
  credentials-init:
    image: python:3.13-slim
    command: ["python", "/scripts/init_credentials.py"]
    volumes:
      - ./scripts/init_credentials.py:/scripts/init_credentials.py:ro
      - secrets:/secrets
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    depends_on:
      credentials-init:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH_FILE: /secrets/neo4j_auth
      NEO4J_db_transaction_timeout: ${NEO4J_TRANSACTION_TIMEOUT:-30s}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - secrets:/secrets:ro
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(cat /secrets/neo4j_admin_password)\" 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the read-only agent user, seeds the synthetic graph, writes the manifest, exits 0.
  graph-ingestion:
    build: ./ingestion
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      <<: *neo4j-client-env
      NEO4J_USER: neo4j
      NEO4J_PASSWORD_FILE: /secrets/neo4j_admin_password
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-synthetic}
      INGESTION_PROVIDER: gcp
    volumes:
      - secrets:/secrets:ro
      - manifest:/data/manifest
    restart: "no"

  digital-twin-api:
    build: ./backend
    depends_on:
      graph-ingestion:
        condition: service_completed_successfully
    environment:
      <<: *neo4j-client-env
      AUDIT_LOG_PATH: /data/audit/queries.jsonl
      SCENARIO_SPEC_DIR: /scenario_specs
      DOCS_DIR: /docs
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-10}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-500}
      QUERY_MAX_RESULT_BYTES: ${QUERY_MAX_RESULT_BYTES:-1000000}
      QUERY_MAX_CONCURRENCY: ${QUERY_MAX_CONCURRENCY:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-120000}
      AGENT_MAX_TOOL_RETRIES: ${AGENT_MAX_TOOL_RETRIES:-2}
      TEXT2CYPHER_MAX_REPAIRS: ${TEXT2CYPHER_MAX_REPAIRS:-2}
    volumes:
      - secrets:/secrets:ro
      - manifest:/data/manifest:ro
      - audit:/data/audit
      - ./ingestion/providers/gcp/synthetic/scenarios:/scenario_specs:ro
      - ./docs:/docs:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  digital-twin-ui:
    build: ./frontend
    depends_on:
      digital-twin-api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://digital-twin-api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  secrets:
  manifest:
  audit:
